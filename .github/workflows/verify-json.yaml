name: verify json

on:
  pull_request:
    branches:
      - master

jobs:
  excavate:
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validator
        uses: ScoopInstaller/GithubActions@124e43c7007c0dab45fe55986f3f853f6dcda709 # main (Nov 25, 2025)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
